services:
  postgres:
    image: postgres:16-alpine
    container_name: zahakowani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zahakowani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zahakowani_dev}
      POSTGRES_DB: ${POSTGRES_DB:-zahakowani}
    ports:
      # Mapowanie na 55432 zamiast 5432, bo na hoście jest już
      # lokalny Postgres innego projektu który zajmuje 5432.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zahakowani} -d ${POSTGRES_DB:-zahakowani}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zahakowani-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
